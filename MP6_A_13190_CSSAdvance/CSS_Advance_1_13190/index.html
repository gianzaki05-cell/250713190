<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Registrasi Mahasiswa Baru</title>
  <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
  <div id="wrapper">
    <h1>Registrasi Mahasiswa Baru</h1>
    <p>Isi biodata di bawah ini dengan benar ya.</p>

    <form action="#" method="post">
      <fieldset>
        <div class="baris">
          <label for="nama">Nama lengkap</label>
          <input type="text" id="nama" name="nama" />
        </div>

        <div class="baris">
          <label for="npm">NPM</label>
          <input type="text" id="npm" name="npm" />
        </div>

        <div class="baris">
          <label for="email">Email</label>
          <input type="text" id="email" name="email" />
        </div>

        <div class="baris">
          <label>Jenis kelamin</label>
          <input type="radio" id="l" name="jk" value="L" /> Laki-laki
          <input type="radio" id="p" name="jk" value="P" /> Perempuan
        </div>

        <div class="baris">
          <label for="prodi">Program studi</label>
          <select id="prodi" name="prodi">
            <option value="if">Informatika</option>
            <option value="ti">Teknik Industri</option>
            <option value="si">Sistem Informasi</option>
          </select>
        </div>

        <div class="baris">
          <label for="alamat">Alamat</label>
          <textarea id="alamat" name="alamat" rows="4" cols="30"></textarea>
        </div>

        <div class="baris">
          <button type="submit">Simpan data</button>
          <button type="reset">Hapus isian</button>
        </div>
      </fieldset>
    </form>
  </div>
</body>
</html>
