<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Daftar Seminar</title>
  <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
  <div id="wrapper">
    <h1>Daftar Seminar Teknologi Web</h1>
    <p>Sabtu, 21 November 2026</p>

    <table>
      <tr class="hlRow">
        <th>Sesi</th>
        <th>Waktu</th>
        <th>Topik</th>
      </tr>
      <tr class="regRow">
        <td>Sesi 1</td>
        <td>09.00 - 10.30</td>
        <td>Dasar web responsif</td>
      </tr>
      <tr class="regRow">
        <td>Sesi 2</td>
        <td>11.00 - 12.30</td>
        <td>Formulir yang mudah dipakai</td>
      </tr>
    </table>

    <form action="#" method="post">
      <fieldset>
        <div class="baris">
          <label for="nama">Nama peserta</label>
          <input type="text" id="nama" name="nama" />
        </div>

        <div class="baris">
          <label for="email">Email</label>
          <input type="text" id="email" name="email" />
        </div>

        <div class="baris">
          <label>Status</label>
          <input type="radio" id="mhs" name="status" value="mhs" /> Mahasiswa
          <input type="radio" id="umum" name="status" value="umum" /> Umum
        </div>

        <div class="baris">
          <label for="sesi">Pilih sesi</label>
          <select id="sesi" name="sesi">
            <option value="1">Sesi 1</option>
            <option value="2">Sesi 2</option>
          </select>
        </div>

        <div class="baris">
          <button type="submit">Daftar sekarang</button>
        </div>
      </fieldset>
    </form>
  </div>
</body>
</html>
